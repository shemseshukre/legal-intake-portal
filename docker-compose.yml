services:

  mysql:
    image: mysql:8.4
    container_name: legal-intake-mysql
    restart: unless-stopped
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: legal_intake
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: legal-intake-backend
    restart: unless-stopped
    environment:
      PORT: 8000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: legal_intake
      DB_USER: root
      DB_PASSWORD: ""
    ports:
      - "8000:8000"
    depends_on:
      - mysql
    volumes:
      - uploads_data:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: legal-intake-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mysql_data:
  uploads_data: